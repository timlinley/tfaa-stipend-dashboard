# Quality checks (Quality Control thread, 11/10/2026; trimmed 11/14 to save GitHub Actions minutes).
# Runs on pull requests that change more than notes (not drafts), plus the full run on Monday mornings.
# Not run again after a merge: the pull request already passed. Library holes: libraries.yml. Leaked keys:
# leaked-keys.yml (that one also runs after each merge).
# Read-only: it uses no secrets and cannot deploy or change anything.
name: Quality checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # drafts wait until marked ready
    paths-ignore: ["**.md", "docs/**"]
  schedule:
    - cron: "0 13 * * 1"   # Mondays 7 AM Central (8 AM during daylight time)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-syntax:
    name: Script syntax
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: Check every script parses
        run: |
          set -e
          for f in *.js; do node --check "$f"; done
          node --check - < apps-script/Code.gs
          node --check - < apps-script/feedback/Feedback.gs
